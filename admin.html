<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>এডমিন ড্যাশবোর্ড — থ্রেডলেবেল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --canvas:#FAF7EC; --ink:#0B0B0B; --ink-soft:#3D3D3D;
    --indigo:#8A6400; --marigold:#FFC501; --teal:#2F2F2F; --paper:#FFFFFF;
    --line: rgba(11,11,11,0.14); --danger:#B23A2F; --success:#2F7D32;
    --font-display:'Anton',sans-serif; --font-body:'Hind Siliguri',sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--canvas); color:var(--ink); font-family:var(--font-body); }
  .wrap{ max-width:1100px; margin:0 auto; padding:24px; }

  /* ---- login screen ---- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-box{
    background:var(--paper); border:1px solid var(--line); border-radius:4px;
    padding:32px; width:100%; max-width:360px;
  }
  .login-box h1{ font-family:var(--font-display); font-size:1.4rem; margin:0 0 4px; }
  .login-box p{ color:var(--ink-soft); font-size:0.88rem; margin:0 0 20px; }
  .login-box input{
    width:100%; padding:12px; border:1px solid var(--line); border-radius:2px;
    font-family:inherit; font-size:0.95rem; margin-bottom:12px; background:var(--canvas);
  }
  .login-box button{
    width:100%; padding:12px; background:var(--ink); color:var(--canvas); border:none;
    border-radius:2px; font-weight:700; font-size:0.95rem; cursor:pointer;
  }
  .login-box button:hover{ background:var(--indigo); }
  .login-err{ color:var(--danger); font-size:0.85rem; margin-top:8px; display:none; }

  /* ---- dashboard ---- */
  #dashboard{ display:none; }
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 0; border-bottom:1px solid var(--line); margin-bottom:24px;
  }
  header.top h1{ font-family:var(--font-display); font-size:1.5rem; margin:0; }
  .logout-btn{
    background:none; border:1px solid var(--ink); color:var(--ink); padding:8px 16px;
    border-radius:2px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .logout-btn:hover{ background:var(--ink); color:var(--canvas); }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  @media (max-width:700px){ .stats{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:16px; }
  .stat-card .num{ font-family:var(--font-display); font-size:1.7rem; }
  .stat-card .lbl{ font-size:0.8rem; color:var(--ink-soft); }

  .filters{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-btn{
    border:1px solid var(--line); background:var(--paper); padding:7px 14px; border-radius:20px;
    font-size:0.82rem; font-weight:600; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .filter-btn.active{ background:var(--ink); color:var(--canvas); border-color:var(--ink); }

  .refresh-btn{
    border:1px solid var(--indigo); background:none; color:var(--indigo); padding:7px 14px;
    border-radius:20px; font-size:0.82rem; font-weight:700; cursor:pointer; font-family:inherit; margin-left:auto;
  }
  .refresh-btn:hover{ background:var(--indigo); color:#fff; }

  .order-card{
    background:var(--paper); border:1px solid var(--line); border-radius:4px;
    padding:18px; margin-bottom:14px;
  }
  .order-top{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .order-id{ font-family:var(--font-display); font-size:1.1rem; }
  .order-date{ font-size:0.78rem; color:var(--ink-soft); }
  .badge{
    display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.72rem; font-weight:700;
  }
  .badge-pending{ background:#F4E3C1; color:#7A5A16; }
  .badge-confirmed{ background:#E4E4E4; color:var(--teal); }
  .badge-delivered{ background:#D6E6D0; color:#3B6B33; }
  .badge-cancelled{ background:#F1D4D0; color:var(--danger); }
  .badge-bkash{ background:var(--indigo); color:#fff; }
  .badge-cod{ background:var(--marigold); color:var(--ink); }

  .order-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; }
  @media (max-width:700px){ .order-grid{ grid-template-columns:1fr; } }
  .order-items{ font-size:0.85rem; }
  .order-items div{ padding:3px 0; border-bottom:1px dotted var(--line); display:flex; justify-content:space-between; }
  .order-info div{ font-size:0.85rem; margin-bottom:4px; }
  .order-info b{ display:inline-block; min-width:90px; }
  .order-total{ font-weight:700; margin-top:8px; font-size:1rem; }

  .status-row{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .status-row label{ font-size:0.78rem; color:var(--ink-soft); margin-right:4px; }
  .status-select{
    padding:7px 10px; border:1px solid var(--line); border-radius:2px; font-family:inherit; font-size:0.85rem;
    background:var(--canvas);
  }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .loading-state{ text-align:center; padding:40px; color:var(--ink-soft); }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--canvas); padding:12px 20px; border-radius:2px;
    font-size:0.9rem; font-weight:600; z-index:90; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  /* ---- tabs ---- */
  .tab-row{ display:flex; gap:8px; margin-bottom:22px; border-bottom:1px solid var(--line); }
  .tab-btn{
    background:none; border:none; padding:10px 4px; margin-right:20px; font-family:inherit;
    font-weight:700; font-size:0.95rem; color:var(--ink-soft); cursor:pointer;
    border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--marigold); }
  .hidden-tab{ display:none !important; }

  /* ---- products tab ---- */
  .btn-add{
    background:var(--ink); color:var(--canvas); border:none; padding:9px 16px;
    border-radius:2px; font-weight:700; font-size:0.85rem; cursor:pointer; font-family:inherit;
  }
  .btn-add:hover{ background:var(--marigold); color:var(--ink); }

  .products-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; }
  .product-card{
    background:var(--paper); border:1px solid var(--line); border-radius:4px; overflow:hidden;
  }
  .product-card .thumb{
    width:100%; height:160px; object-fit:cover; background:var(--canvas-2);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:0.8rem;
  }
  .product-card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .product-card .pbody{ padding:12px 14px; }
  .product-card .pname{ font-weight:700; font-size:0.92rem; margin-bottom:4px; min-height:2.4em; }
  .product-card .pmeta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .product-card .pprice{ font-family:var(--font-display); font-weight:700; color:var(--ink); }
  .product-card .pstatus{ font-size:0.72rem; padding:3px 8px; border-radius:20px; font-weight:700; }
  .pstatus.on{ background:#D6E6D0; color:#3B6B33; }
  .pstatus.off{ background:#F1D4D0; color:var(--danger); }
  .product-card .pactions{ display:flex; gap:8px; }
  .pactions button{
    flex:1; padding:7px 0; border-radius:2px; border:1px solid var(--line); background:var(--canvas);
    font-family:inherit; font-size:0.8rem; font-weight:600; cursor:pointer;
  }
  .pactions .edit-btn:hover{ background:var(--ink); color:var(--canvas); }
  .pactions .del-btn{ color:var(--danger); border-color:var(--danger); }
  .pactions .del-btn:hover{ background:var(--danger); color:#fff; }

  /* ---- product modal (shares .modal-overlay/.modal/.field with the base look) ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(11,11,11,0.55); z-index:80;
    display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal{ background:var(--paper); border-radius:4px; width:min(480px,100%); padding:26px; margin:20px 0; }
  .modal h3{ font-family:var(--font-display); font-size:1.3rem; margin:0 0 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-weight:700; font-size:0.82rem; margin-bottom:5px; }
  .field input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:2px;
    font-family:inherit; font-size:0.9rem; background:var(--canvas);
  }
  .img-preview{ margin-top:10px; max-width:140px; max-height:140px; border-radius:2px; border:1px solid var(--line); display:block; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .btn-outline{
    background:none; border:1px solid var(--ink); color:var(--ink); padding:10px 18px;
    border-radius:2px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn-save{
    background:var(--ink); color:var(--canvas); border:none; padding:10px 18px;
    border-radius:2px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn-save:hover{ background:var(--marigold); color:var(--ink); }
  .btn-save:disabled{ opacity:0.6; cursor:default; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>এডমিন লগইন</h1>
    <p>Supabase-এ তৈরি করা এডমিন ইমেইল ও পাসওয়ার্ড দিন</p>
    <form id="loginForm">
      <input type="email" id="emailInput" placeholder="ইমেইল" autocomplete="username" required>
      <input type="password" id="pwInput" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
      <button type="submit">লগইন করুন</button>
      <div class="login-err" id="loginErr">লগইন ব্যর্থ হয়েছে</div>
    </form>
  </div>
</div>

<div id="dashboard">
  <div class="wrap">
    <header class="top">
      <h1>এডমিন ড্যাশবোর্ড</h1>
      <button class="logout-btn" id="logoutBtn">লগআউট</button>
    </header>

    <div class="tab-row">
      <button class="tab-btn active" data-tab="orders">অর্ডার</button>
      <button class="tab-btn" data-tab="products">প্রোডাক্ট</button>
    </div>

    <!-- ================= ORDERS TAB ================= -->
    <section id="ordersTab">
      <div class="stats" id="statsRow"></div>

      <div class="filters" id="filterRow">
        <button class="filter-btn active" data-filter="all">সব</button>
        <button class="filter-btn" data-filter="pending">পেন্ডিং</button>
        <button class="filter-btn" data-filter="confirmed">কনফার্মড</button>
        <button class="filter-btn" data-filter="delivered">ডেলিভারড</button>
        <button class="filter-btn" data-filter="cancelled">বাতিল</button>
        <button class="refresh-btn" id="refreshBtn">রিফ্রেশ করুন</button>
      </div>

      <div id="ordersContainer"><div class="loading-state">লোড হচ্ছে...</div></div>
    </section>

    <!-- ================= PRODUCTS TAB ================= -->
    <section id="productsTab" class="hidden-tab">
      <div class="filters">
        <button class="btn-add" id="addProductBtn">+ নতুন প্রোডাক্ট যোগ করুন</button>
        <button class="refresh-btn" id="refreshProductsBtn">রিফ্রেশ করুন</button>
      </div>
      <div id="productsContainer"><div class="loading-state">লোড হচ্ছে...</div></div>
    </section>
  </div>
</div>

<!-- ================= PRODUCT FORM MODAL ================= -->
<div class="modal-overlay" id="productModalOverlay">
  <div class="modal">
    <h3 id="productModalTitle">নতুন প্রোডাক্ট</h3>
    <form id="productForm">
      <input type="hidden" id="p_id">
      <div class="field">
        <label for="p_name">প্রোডাক্টের নাম *</label>
        <input id="p_name" type="text" required>
      </div>
      <div class="field">
        <label for="p_price">দাম (৳) *</label>
        <input id="p_price" type="number" min="0" step="1" required>
      </div>
      <div class="field">
        <label for="p_sizes">সাইজ (কমা দিয়ে আলাদা করুন)</label>
        <input id="p_sizes" type="text" value="S,M,L,XL">
      </div>
      <div class="field">
        <label for="p_image">প্রোডাক্টের ছবি</label>
        <input id="p_image" type="file" accept="image/*">
        <img id="p_imagePreview" class="img-preview hidden-tab">
      </div>
      <div class="field" style="display:flex; align-items:center; gap:8px;">
        <input id="p_active" type="checkbox" style="width:auto;" checked>
        <label for="p_active" style="margin:0;">সাইটে দেখানো হবে (সক্রিয়)</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="productCancelBtn">বাতিল</button>
        <button type="submit" class="btn-save" id="productSaveBtn">সেভ করুন</button>
      </div>
    </form>
  </div>
</div>


<div class="toast" id="toast"></div>

<script>
/* ================================================================
   SUPABASE কনফিগারেশন — index.html-এর মতো একই মান বসান
   ================================================================ */
const SUPABASE_URL = 'flopnjhnkddcbxpnpxrm.supabase.com';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsb3Buamhua2RkY2J4cG5weHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTY2NDAsImV4cCI6MjEwMzU5MjY0MH0.9zDz-4wN9110MZ3eyyqsElGQtIQsSVvmAEpdg5pYZKM';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let ALL_ORDERS = [];
let currentFilter = 'all';

const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');

async function checkSession(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session){ showDashboard(); }
}
checkSession();

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  const pw = document.getElementById('pwInput').value;
  const errEl = document.getElementById('loginErr');
  const { data, error } = await supabase.auth.signInWithPassword({ email, password: pw });
  if(!error && data.session){
    errEl.style.display = 'none';
    showDashboard();
  } else {
    errEl.textContent = 'ইমেইল বা পাসওয়ার্ড ভুল';
    errEl.style.display = 'block';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await supabase.auth.signOut();
  location.reload();
});

function showDashboard(){
  loginScreen.style.display = 'none';
  dashboard.style.display = 'block';
  loadOrders();
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b===btn));
    const tab = btn.dataset.tab;
    document.getElementById('ordersTab').classList.toggle('hidden-tab', tab!=='orders');
    document.getElementById('productsTab').classList.toggle('hidden-tab', tab!=='products');
    if(tab==='products'){ loadProducts(); }
  });
});

document.getElementById('refreshBtn').addEventListener('click', loadOrders);

document.getElementById('filterRow').addEventListener('click', (e)=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active', b===btn));
  renderOrders();
});

async function loadOrders(){
  document.getElementById('ordersContainer').innerHTML = '<div class="loading-state">লোড হচ্ছে...</div>';
  const { data, error } = await supabase
    .from('orders')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    document.getElementById('ordersContainer').innerHTML = '<div class="loading-state">অর্ডার লোড করা যায়নি। রিফ্রেশ করে আবার চেষ্টা করুন।</div>';
    return;
  }
  ALL_ORDERS = data || [];
  renderStats();
  renderOrders();
}

function renderStats(){
  const total = ALL_ORDERS.length;
  const pending = ALL_ORDERS.filter(o=>o.status==='pending').length;
  const bkash = ALL_ORDERS.filter(o=>o.payment_method==='bkash').length;
  const revenue = ALL_ORDERS.reduce((s,o)=>s + Number(o.total||0), 0);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">মোট অর্ডার</div></div>
    <div class="stat-card"><div class="num">${pending}</div><div class="lbl">পেন্ডিং অর্ডার</div></div>
    <div class="stat-card"><div class="num">${bkash}</div><div class="lbl">বিকাশ পেমেন্ট</div></div>
    <div class="stat-card"><div class="num">৳${revenue}</div><div class="lbl">মোট বিক্রি (টাকা)</div></div>
  `;
}

function statusLabel(s){
  return { pending:'পেন্ডিং', confirmed:'কনফার্মড', delivered:'ডেলিভারড', cancelled:'বাতিল' }[s] || s;
}

function renderOrders(){
  const container = document.getElementById('ordersContainer');
  let list = ALL_ORDERS;
  if(currentFilter !== 'all'){ list = list.filter(o=>o.status === currentFilter); }

  if(list.length === 0){
    container.innerHTML = '<div class="empty-state">এই ফিল্টারে কোনো অর্ডার নেই</div>';
    return;
  }

  container.innerHTML = list.map(o=>{
    const itemsHtml = (o.items||[]).map(it=>`<div><span>${escapeHtml(it.name)} (${escapeHtml(it.size)}) × ${it.qty}</span><span>৳${it.price*it.qty}</span></div>`).join('');
    const payBadge = o.payment_method === 'bkash' ? '<span class="badge badge-bkash">বিকাশ</span>' : '<span class="badge badge-cod">COD</span>';
    return `
    <div class="order-card">
      <div class="order-top">
        <div>
          <span class="order-id">${escapeHtml(o.order_code)}</span>
          <div class="order-date">${escapeHtml(new Date(o.created_at).toLocaleString('bn-BD'))}</div>
        </div>
        <div>
          ${payBadge}
          <span class="badge badge-${o.status}">${statusLabel(o.status)}</span>
        </div>
      </div>
      <div class="order-grid">
        <div class="order-items">${itemsHtml}
          <div class="order-total">সর্বমোট: ৳${o.total}</div>
        </div>
        <div class="order-info">
          <div><b>নাম:</b> ${escapeHtml(o.name)}</div>
          <div><b>ফোন:</b> ${escapeHtml(o.phone)}</div>
          <div><b>ঠিকানা:</b> ${escapeHtml(o.address)}</div>
          ${o.payment_method==='bkash' ? `<div><b>ট্রানজেকশন আইডি:</b> ${escapeHtml(o.trx_id)}</div>` : ''}
        </div>
      </div>
      <div class="status-row">
        <label>স্ট্যাটাস বদলান:</label>
        <select class="status-select" data-id="${o.id}">
          <option value="pending" ${o.status==='pending'?'selected':''}>পেন্ডিং</option>
          <option value="confirmed" ${o.status==='confirmed'?'selected':''}>কনফার্মড</option>
          <option value="delivered" ${o.status==='delivered'?'selected':''}>ডেলিভারড</option>
          <option value="cancelled" ${o.status==='cancelled'?'selected':''}>বাতিল</option>
        </select>
      </div>
    </div>`;
  }).join('');

  container.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const id = sel.dataset.id;
      const status = sel.value;
      const { error } = await supabase.from('orders').update({ status }).eq('id', id);
      if(!error){
        const ord = ALL_ORDERS.find(o=>o.id===id);
        if(ord) ord.status = status;
        renderStats();
        renderOrders();
        showToast('স্ট্যাটাস আপডেট হয়েছে');
      } else {
        showToast('আপডেট ব্যর্থ হয়েছে');
      }
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ================================================================
   প্রোডাক্ট ম্যানেজমেন্ট
   ================================================================ */
let ALL_PRODUCTS = [];
let selectedImageFile = null;

async function loadProducts(){
  const container = document.getElementById('productsContainer');
  container.innerHTML = '<div class="loading-state">লোড হচ্ছে...</div>';
  const { data, error } = await supabase
    .from('products')
    .select('*')
    .order('sort_order', { ascending: true });

  if(error){
    container.innerHTML = '<div class="loading-state">প্রোডাক্ট লোড করা যায়নি।</div>';
    return;
  }
  ALL_PRODUCTS = data || [];
  renderProductsGrid();
}

function renderProductsGrid(){
  const container = document.getElementById('productsContainer');
  if(ALL_PRODUCTS.length === 0){
    container.innerHTML = '<div class="empty-state">এখনো কোনো প্রোডাক্ট নেই। "নতুন প্রোডাক্ট যোগ করুন" চাপুন।</div>';
    return;
  }
  container.innerHTML = `<div class="products-grid">${ALL_PRODUCTS.map(p=>`
    <div class="product-card">
      <div class="thumb">${p.image_url ? `<img src="${p.image_url}" alt="${escapeHtml(p.name)}">` : 'ছবি নেই'}</div>
      <div class="pbody">
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="pmeta">
          <span class="pprice">৳${p.price}</span>
          <span class="pstatus ${p.active ? 'on':'off'}">${p.active ? 'সক্রিয়' : 'নিষ্ক্রিয়'}</span>
        </div>
        <div class="pactions">
          <button type="button" class="edit-btn" data-edit="${p.id}">এডিট</button>
          <button type="button" class="del-btn" data-del="${p.id}">ডিলিট</button>
        </div>
      </div>
    </div>
  `).join('')}</div>`;
}

document.getElementById('refreshProductsBtn').addEventListener('click', loadProducts);

document.getElementById('productsContainer').addEventListener('click', (e)=>{
  const editBtn = e.target.closest('[data-edit]');
  const delBtn = e.target.closest('[data-del]');
  if(editBtn){ openProductModal(ALL_PRODUCTS.find(p=>p.id===editBtn.dataset.edit)); }
  if(delBtn){ deleteProduct(delBtn.dataset.del); }
});

document.getElementById('addProductBtn').addEventListener('click', ()=> openProductModal(null));

const productModalOverlay = document.getElementById('productModalOverlay');
const productForm = document.getElementById('productForm');

function openProductModal(product){
  selectedImageFile = null;
  document.getElementById('productModalTitle').textContent = product ? 'প্রোডাক্ট এডিট করুন' : 'নতুন প্রোডাক্ট';
  document.getElementById('p_id').value = product ? product.id : '';
  document.getElementById('p_name').value = product ? product.name : '';
  document.getElementById('p_price').value = product ? product.price : '';
  document.getElementById('p_sizes').value = product && product.sizes ? product.sizes.join(',') : 'S,M,L,XL';
  document.getElementById('p_active').checked = product ? !!product.active : true;
  document.getElementById('p_image').value = '';
  const preview = document.getElementById('p_imagePreview');
  if(product && product.image_url){
    preview.src = product.image_url;
    preview.classList.remove('hidden-tab');
  } else {
    preview.classList.add('hidden-tab');
  }
  productModalOverlay.classList.add('open');
}

document.getElementById('productCancelBtn').addEventListener('click', ()=>{
  productModalOverlay.classList.remove('open');
});

document.getElementById('p_image').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  selectedImageFile = file;
  const preview = document.getElementById('p_imagePreview');
  preview.src = URL.createObjectURL(file);
  preview.classList.remove('hidden-tab');
});

productForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const saveBtn = document.getElementById('productSaveBtn');
  const originalLabel = saveBtn.textContent;
  saveBtn.disabled = true;
  saveBtn.textContent = 'সেভ হচ্ছে...';

  try{
    const id = document.getElementById('p_id').value || null;
    const name = document.getElementById('p_name').value.trim();
    const price = Number(document.getElementById('p_price').value);
    const sizes = document.getElementById('p_sizes').value.split(',').map(s=>s.trim()).filter(Boolean);
    const active = document.getElementById('p_active').checked;

    let image_url = null;
    if(id){
      const existing = ALL_PRODUCTS.find(p=>p.id===id);
      image_url = existing ? existing.image_url : null;
    }

    if(selectedImageFile){
      const fileName = `${Date.now()}-${selectedImageFile.name.replace(/\s+/g,'_')}`;
      const { error: uploadError } = await supabase.storage
        .from('product-images')
        .upload(fileName, selectedImageFile, { upsert: true });
      if(uploadError){
        showToast('ছবি আপলোড ব্যর্থ হয়েছে');
        saveBtn.disabled = false;
        saveBtn.textContent = originalLabel;
        return;
      }
      const { data: publicUrlData } = supabase.storage.from('product-images').getPublicUrl(fileName);
      image_url = publicUrlData.publicUrl;
    }

    const payload = { name, price, sizes, active, image_url };

    let error;
    if(id){
      ({ error } = await supabase.from('products').update(payload).eq('id', id));
    } else {
      payload.sort_order = ALL_PRODUCTS.length;
      ({ error } = await supabase.from('products').insert([payload]));
    }

    if(error){
      showToast('সেভ করা যায়নি, আবার চেষ্টা করুন');
    } else {
      showToast(id ? 'প্রোডাক্ট আপডেট হয়েছে' : 'নতুন প্রোডাক্ট যোগ হয়েছে');
      productModalOverlay.classList.remove('open');
      loadProducts();
    }
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = originalLabel;
  }
});

async function deleteProduct(id){
  if(!confirm('এই প্রোডাক্টটা ডিলিট করবেন? এটা আর ফিরিয়ে আনা যাবে না।')) return;
  const { error } = await supabase.from('products').delete().eq('id', id);
  if(error){
    showToast('ডিলিট করা যায়নি');
  } else {
    showToast('প্রোডাক্ট ডিলিট হয়েছে');
    loadProducts();
  }
}
</script>
</body>
</html>
